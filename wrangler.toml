name = "mun-debate-central"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# Serve the built SPA as static assets
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "mun-debate-central-db"
database_id = "0d7a0941-2eab-4bd0-a2cc-d6341e921242"
migrations_dir = "migrations"

# Cron triggers for scheduled ingestion and notifications
[triggers]
crons = ["0 */6 * * *"]  # Every 6 hours

# Environment variables
[vars]
ENVIRONMENT = "production"

