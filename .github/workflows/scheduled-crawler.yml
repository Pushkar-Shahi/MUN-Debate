name: Scheduled Event Discovery Crawler

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  crawl:
    name: Crawl Circuit Sources & Ingest Opportunities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Automated Crawler Pipeline
        run: npm run crawl
        env:
          NODE_ENV: production

      - name: Commit & push if new events discovered
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/services/mockData.ts
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(crawler): ingest newly discovered circuit events [skip ci]" && git push)
