<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>MUN & Debate Central — Opportunity Discovery Platform</title>
    <meta name="description" content="Centralized discovery platform for Model United Nations (MUN), parliamentary debates, Youth Parliament, and student competitions." />

    <!-- PWA Manifest & Mobile Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MUN Central" />
    <meta name="application-name" content="MUN Central" />
    <meta name="theme-color" content="#0f0f12" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph & Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MUN & Debate Central — Opportunity Discovery Platform" />
    <meta property="og:description" content="Centralized discovery, tracking, and management platform for Model United Nations, debates, and collegiate championships." />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('PWA ServiceWorker registered with scope:', reg.scope);
            },
            (err) => {
              console.warn('PWA ServiceWorker registration failed:', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
